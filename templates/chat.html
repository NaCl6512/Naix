<!DOCTYPE html>
<html>
<head>
    <title>Чат: {{ chat_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <h2>Чат: {{ chat_name }}</h2>
        <div class="messages">
            {% for msg in messages %}
                {% if msg.username == username %}
                    <div class="message own">{{ msg.text }}</div>
                {% else %}
                    <div class="message other">
                        <strong>{{ msg.username }}</strong><br>{{ msg.text }}
                    </div>
                {% endif %}
            {% endfor %}
        </div>
        <form method="post" class="message-form">
            <input type="text" name="message" placeholder="Введите сообщение" required>
            <button type="submit">Отправить</button>
        </form>
        <a href="/lobby" class="logout">Назад в лобби</a>
    </div>
</body>
</html>
