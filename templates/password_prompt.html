<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в чат {{ chat_name }}</title>
</head>
<body>
    <h1>Введите пароль для чата "{{ chat_name }}"</h1>
    
    <!-- Вывод ошибки, если неправильный пароль -->
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label for="password">Пароль:</label>
        <input type="password" name="password" required>
        <button type="submit">Войти</button>
    </form>

    <a href="/lobby">Назад в лобби</a>
</body>
</html>
